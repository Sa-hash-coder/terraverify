[package]
name = "carbon_credit"
version = "0.1.0"
description = "Token-2022 Carbon Credit Minting & Permanent Delegate Revocation Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "carbon_credit"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }

