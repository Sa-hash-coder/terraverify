[package]
name = "project_registry"
version = "0.1.0"
description = "On-Chain Land Registry & Ecological Parcel Metadata"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "project_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }

